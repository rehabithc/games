<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ゲーム</title>
<style>
:root{--bg:#f6f4ee;--fg:#2b2a26;--sub:#6b6860;--line:#d8d4c8;--card:#fff;--acc:#3f6b3a}
@media (prefers-color-scheme: dark){:root{--bg:#1d1e1b;--fg:#ecebe6;--sub:#a9a69c;--line:#3a3b36;--card:#262723;--acc:#8fbf86}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;color:inherit;text-decoration:none}
a.card b{color:var(--acc);font-size:1.15em}
footer{color:var(--sub);font-size:.85em;border-top:1px solid var(--line);margin-top:28px;padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>ブラウザで遊べるゲーム</h1>

<footer>© 2026 株式会社リハビット　制作: Clinica Fermentica　どのゲームも通信はしません。</footer>
</div>
</body>
</html>
